<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #181818; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    color: #f4f4f4;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Safe zone: avoid top ~250px (status bar, IG header) and bottom ~480px (IG controls).
     Content lives in the middle band. */
  .card-text {
    position: absolute;
    left: 100px;
    right: 100px;
    top: 300px;
    bottom: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .card-text p {
    font-weight: 500;
    font-size: 52px;
    line-height: 1.45;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .card-text p em {
    font-style: italic;
    font-weight: 400;
    color: rgba(244, 244, 244, 0.85);
  }

  .handle {
    position: absolute;
    bottom: 440px;
    font-weight: 600;
    font-size: 36px;
    color: rgba(244, 244, 244, 0.35);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card-text">
    <p id="text"></p>
  </div>
  <div class="handle" id="handle">@iamjoshauld</div>

<script>
// Shrink text until it fits the container
function fit(el, minPx) {
  let size = parseFloat(getComputedStyle(el).fontSize);
  const container = el.parentElement;
  while (el.scrollHeight > container.clientHeight && size > minPx) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
  return size;
}

window.setup = function(d) {
  const el = document.getElementById('text');
  el.innerHTML = d.text;
  if (d.handle) document.getElementById('handle').textContent = d.handle;
  const fontSize = fit(el, 32);
  return { fontSize, chars: d.text.length };
};
</script>
</body>
</html>
